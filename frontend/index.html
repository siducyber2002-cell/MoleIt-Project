<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mole It — Molecular Study Lab</title>
    <meta name="theme-color" content="#F0EDEA" />

    <!-- Homepage typeface (IBM Plex Sans / Mono). Other pages keep their own stacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Several pages use the light "paper" theme, not just the homepage —
      // see LIGHT_CANVAS_PATHS in App.jsx. Each of those pages only adds
      // .theme-indisea itself once React has mounted (via its own
      // useEffect), which left a ~1s dark flash on refresh for every one of
      // them except "/". Flag all of them here, synchronously, before the
      // first paint, so there's nothing to flash at all — just the splash
      // logo sitting on the correct background the whole time.
      var LIGHT_CANVAS_PATHS = ['/', '/login', '/register', '/functional-groups', '/group-theory'];
      if (LIGHT_CANVAS_PATHS.indexOf(location.pathname) !== -1) {
        document.documentElement.classList.add('theme-indisea');
      }
    </script>
    <meta name="description" content="Draw molecules, explore them in 3D, and study a library of famous compounds." />

    <!--
      No forced background color here — explicitly transparent. Note that
      "transparent" and "no rule at all" render identically: there's nothing
      behind a browser tab's content area except its own default canvas
      (white), so transparent just reveals that same white. There's no way
      to get a background *other* than white without painting one on
      ourselves — which is the flash this is specifically trying to avoid.
    -->
    <style>
      html, body {
        margin: 0;
        background: transparent;
      }
    </style>

    <!--
      Initial splash / "refresh buffer" screen. This is plain HTML+CSS (no
      React) so it paints immediately on first load or a hard refresh,
      before the JS bundle has even finished downloading/parsing. It sits
      on top of #root and is faded out + removed by main.jsx once React
      has mounted.

      This reproduces the exact molecule mark used in the browser tab
      favicon (see public/favicon.svg) — the same bare geometry (no
      background box), rotating the same way. The loader itself has no
      background fill; the dark color visible around it is the page
      background set above, not part of the loader.
    -->
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: transparent;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Spin the whole <svg> box with a plain CSS animation. (SVG SMIL
         <animateTransform> was flaky: while the JS bundle loads, the SMIL
         timeline sometimes never started and the mark sat still.) The
         viewBox centre (20,20) is the box centre, so it spins in place. */
      #initial-loader .splash-mark {
        overflow: visible;
        transform-origin: 50% 50%;
        animation: splash-spin 3s linear infinite;
        will-change: transform;
      }
      @keyframes splash-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader .splash-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <svg class="splash-mark" viewBox="0 0 40 40" width="48" height="48">
        <g>
          <line x1="20" y1="20" x2="9" y2="12" stroke="#5eead4" stroke-width="1.6"/>
          <line x1="20" y1="20" x2="31" y2="12" stroke="#a78bfa" stroke-width="1.6"/>
          <line x1="20" y1="20" x2="20" y2="33" stroke="#ec4899" stroke-width="1.6"/>
          <circle cx="9" cy="12" r="3.4" fill="#5eead4"/>
          <circle cx="31" cy="12" r="3.4" fill="#a78bfa"/>
          <circle cx="20" cy="33" r="3" fill="#ec4899"/>
        </g>
        <circle cx="20" cy="20" r="4.2" fill="#22d3ee"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
